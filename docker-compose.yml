x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME}
  env_file: .env
  restart: unless-stopped
  user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
  environment:
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: ${AIRFLOW__WEBSERVER__EXPOSE_CONFIG}
    TZ: "Europe/Moscow"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "set -e;
               airflow db migrate &&
               airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true;
               echo 'Init done';"

  webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["airflow", "webserver"]
    ports:
      - "8081:8080"   # хост:контейнер (Oracle сидит на 8080 хоста)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      webserver:
        condition: service_healthy
    command: ["airflow", "scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 20

  triggerer:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      webserver:
        condition: service_healthy
    command: ["airflow", "triggerer"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname $$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  superset-init:
    image: apache/superset:3.1.0
    env_file: .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      /bin/bash -c "
        set -e;
        superset db upgrade &&
        (superset fab create-admin \
          --username ${SUPERSET_ADMIN_USERNAME} \
          --firstname Superset \
          --lastname Admin \
          --email ${SUPERSET_ADMIN_EMAIL} \
          --password ${SUPERSET_ADMIN_PASSWORD} || echo 'Admin already exists, skipping creation') &&
        superset init
      "

  superset:
    image: apache/superset:3.1.0
    env_file: .env
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "8088:8088"
    volumes:
      - superset-home:/app/superset_home
    command: >
      gunicorn --bind 0.0.0.0:8088 "superset.app:create_app()"

volumes:
  postgres-db-volume:
  superset-home:
